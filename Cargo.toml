[workspace]
members = [
    "src/clonodist-core",
    "src/clonodist-germline",
    "src/clonodist-io",
    "src/clonodist-distance",
    "src/clonodist-sparse",
    "src/clonodist-neighbors",
    "src/clonodist-bench",
    "src/clonodist-cli",
    "src/clonodist-integration",
    "src/clonodist-extended",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
csv = "=1.3.1"
rayon = "=1.12.0"
sha2 = "=0.10.9"
clap = { version = "=4.5.26", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
